name: Verify and Deploy to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure required files exist
        run: |
          required_files=("README.md" "requirements.txt" "app.py" "scripts/verify_imports.py")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports
        run: python scripts/verify_imports.py

      - name: Smoke-import application
        run: python -c "import app"

      - name: Compile Python files
        run: python -m compileall -q app.py scripts

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Hugging Face target
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [[ ! "$HF_SPACE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Repository variable HF_SPACE_ID is required (example: your-hf-user/your-space-name)."
            exit 1
          fi

      - name: Push to Hugging Face Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Repository secret HF_TOKEN is required."
            exit 1
          fi

          git remote add space "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}"
          git push --force space HEAD:main
