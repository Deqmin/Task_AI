<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Sentiment Stream Analyzer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4f0e8;
        color: #182225;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top right, #d8ebe4, #f4f0e8 55%);
      }

      main {
        width: min(680px, calc(100% - 40px));
        padding: 48px 0;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #b24c32;
        font: 700 0.8rem/1.2 Georgia, "Times New Roman", serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-size: clamp(2.8rem, 8vw, 5.8rem);
        line-height: 0.95;
        font-weight: 500;
      }

      p {
        max-width: 560px;
        margin: 24px 0 0;
        font-size: 1.15rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 32px;
        padding: 14px 20px;
        border-radius: 4px;
        background: #182225;
        color: #fff;
        text-decoration: none;
        font: 700 0.95rem/1.2 system-ui, sans-serif;
      }

      a:hover,
      a:focus-visible {
        background: #b24c32;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">AI Solution Engineering Assignment</p>
      <h1>Live Sentiment Stream Analyzer</h1>
      <p>
        Type a message, inspect the model confidence, tune the alert threshold,
        and export the session event log. The Python demo runs on Hugging Face Spaces.
      </p>
      <a href="https://huggingface.co/spaces/deqmin/live-sentiment-stream-analyzer">
        Open the live analyzer
      </a>
    </main>
  </body>
</html>
